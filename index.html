 it freely."}},{"id":"fun","title":"Fun Words & Slang","icon":"🤩","color":"#ffaa00","colorBg":"255,170,0","phrases":[{"en":"Really?!","jp":"まじで？！","ro":"Maji de?!"},{"en":"Awesome!","jp":"すごい！","ro":"Sugoi!"},{"en":"Cute!","jp":"かわいい","ro":"Kawaii"},{"en":"Pretty / Beautiful","jp":"きれい","ro":"Kirei"},{"en":"I don't like it","jp":"きらい","ro":"Kirai"},{"en":"Scary","jp":"こわい","ro":"Kowai"},{"en":"Tired...","jp":"つかれた〜","ro":"Tsukareta~"},{"en":"Yummy!","jp":"うまい！","ro":"Umai!"},{"en":"Let's go!","jp":"行こう！","ro":"Ikou!"},{"en":"No way!","jp":"うそ！","ro":"Uso!"}],"tip":{"icon":"⚠️","title":"Watch out!","text":"Don't confuse <b>kirei</b> (pretty ✨) with <b>kirai</b> (dislike 💔)<br>Telling someone \"You are kirai\" is NOT a compliment!<br><br>Also: <b>kowai</b> = scary 👻 vs <b>kawaii</b> = cute 🐰<br>Be careful or you might call a baby \"terrifying\" instead of \"adorable\""}},{"id":"shopping","title":"Shopping & Souvenirs","icon":"🛍️","color":"#00d2ff","colorBg":"0,210,255","phrases":[{"en":"How much is it?","jp":"いくらですか？","ro":"Ikura desu ka?"},{"en":"This is expensive!","jp":"これは高い！","ro":"Kore wa takai!"},{"en":"Can you make it cheaper?","jp":"安くなりますか？","ro":"Yasuku narimasu ka?"},{"en":"Cheap!","jp":"安い！","ro":"Yasui!"},{"en":"Can I get a freebie?","jp":"おまけありますか？","ro":"Omake arimasu ka?"},{"en":"I'll take this one","jp":"これください","ro":"Kore kudasai"},{"en":"Just looking","jp":"見てるだけです","ro":"Miteru dake desu"},{"en":"Can I try it on?","jp":"試着できますか？","ro":"Shichaku dekimasu ka?"},{"en":"Do you have my size?","jp":"サイズありますか？","ro":"Saizu arimasu ka?"},{"en":"Do you have other colors?","jp":"色ちがいはありますか？","ro":"Iro chigai wa arimasu ka?"},{"en":"What do you recommend?","jp":"おすすめは？","ro":"Osusume wa?"},{"en":"It's a gift","jp":"プレゼントです","ro":"Purezento desu"},{"en":"I don't need a bag","jp":"袋いりません","ro":"Fukuro irimasen"},{"en":"Please give me a bag","jp":"袋ください","ro":"Fukuro kudasai"},{"en":"I'll pay in cash","jp":"現金で払います","ro":"Genkin de haraimasu"}],"tip":null},{"id":"romance","title":"Romance & Love","icon":"💕","color":"#ff8aa3","colorBg":"255,138,163","phrases":[{"en":"I like you","jp":"好きです！","ro":"Suki desu!"},{"en":"I love you sooo much!","jp":"大好き！","ro":"Daisuki!"},{"en":"Will you go out with me?","jp":"付き合ってください","ro":"Tsukiatte kudasai"},{"en":"I have a boyfriend","jp":"彼氏がいます","ro":"Kareshi ga imasu"},{"en":"I have a girlfriend","jp":"彼女がいます","ro":"Kanojo ga imasu"},{"en":"You're my type","jp":"タイプです","ro":"Taipu desu"},{"en":"My heart is pounding","jp":"ドキドキする","ro":"Dokidoki suru"},{"en":"That made my heart skip a beat","jp":"キュンとした","ro":"Kyun to shita"},{"en":"Shall we go on a date?","jp":"デートしませんか？","ro":"Deeto shimasen ka?"},{"en":"Can I give you a hug?","jp":"ハグしてもいい？","ro":"Hagu shite mo ii?"},{"en":"Can I kiss you?","jp":"チューしてもいい？","ro":"Chuu shite mo ii?"},{"en":"Don't cheat on me!","jp":"浮気しないでね！","ro":"Uwaki shinai de ne!"},{"en":"Maybe it's destiny...","jp":"運命かも…","ro":"Unmei kamo..."}],"tip":{"icon":"🤭","title":"Don't confuse!","text":"<b>スキ (suki)</b> = I like you 💗<br><b>スッキリ (sukkiri)</b> = Refreshed/relieved 🛁<br><br>Don't mix them up after the bath!"}}]};

const TRIPS=[{"id":"kamakura","name":"Kamakura","kanji":"鎌倉","tag":"Historic","color":"#9650ff","colorBg":"150,80,255","time":"57 min","price":"¥1,040","short":"Coastal samurai capital with the Great Buddha, washing-money shrines, and Slam Dunk vibes.","desc":"Once the political capital of Japan during the Kamakura period (1185-1333), this coastal town is now a treasure trove of ancient temples, samurai history and surfing beaches. The Great Buddha of Kamakura — an 11-meter bronze statue dating from 1252 — sits serenely in the open air at Kotoku-in temple. Wander the bamboo grove of Hokoku-ji, ring the bell at Tsurugaoka Hachimangu Shrine, or hop on the retro Enoden tram line along the Pacific coast.","highlights":["Great Buddha (Daibutsu) of Kotoku-in — 11.4m bronze statue from 1252","Tsurugaoka Hachimangu — main Shinto shrine of the city","Hasedera Temple with its 9m wooden Kannon","Enoden retro tram line along the coast","Komachi-dori shopping street"],"tip":"Visit Zeniarai Benzaiten Shrine — wash your money in the spring and folklore says it'll multiply. Total Zelda vibes — like walking into Hyrule.","transport":[{"name":"JR Yokosuka Line","from":"Tokyo Station","time":"57 min","price":"¥1,040","jrPass":true,"note":"Direct, no transfers"},{"name":"JR Shonan-Shinjuku Line","from":"Shinjuku Station","time":"57 min","price":"¥1,040","jrPass":true,"note":"Direct (boards bound for Zushi)"},{"name":"Enoshima-Kamakura Freepass","from":"Odakyu (Shinjuku)","time":"~90 min","price":"¥1,640","jrPass":false,"note":"Includes Enoden unlimited"}],"destination":"Kamakura Station, Kamakura, Kanagawa, Japan","mapsCoord":"35.6892,139.5503"},{"id":"fuji","name":"Mt. Fuji","kanji":"富士山","tag":"Nature","color":"#00d2ff","colorBg":"0,210,255","time":"1h 55min","price":"from ¥1,750","short":"Japan's sacred 3,776m volcano. UNESCO World Heritage. Lakes, shrines and the iconic snow-capped peak.","desc":"The most iconic mountain on Earth — a perfect cone rising 3,776m, sacred to Shinto, painted by Hokusai, climbed by pilgrims. The Fuji Five Lakes region around its base offers the best views without climbing. Kawaguchiko is the most accessible: lakeside hot springs, the Chureito Pagoda viewpoint, and on clear days, that absolutely unreal reflection of Fuji on the water.","highlights":["Chureito Pagoda — the famous postcard view (5-story red pagoda + Fuji)","Lake Kawaguchiko panoramic views","Mt. Fuji Panoramic Ropeway","Oshino Hakkai — 8 spring-fed ponds","Climbing season July-September only (Yoshida trail)"],"tip":"Best views are clearest in the early morning before clouds form. Check the weather — if it's cloudy, Fuji hides completely. November-February has highest clear-day rates.","transport":[{"name":"Fuji Excursion Limited Express","from":"Shinjuku Station","time":"1h 55min","price":"¥4,200","jrPass":"Partial","note":"Fastest, direct, reserved seats"},{"name":"Highway Bus","from":"Busta Shinjuku","time":"2h","price":"¥1,750","jrPass":false,"note":"Cheapest & easy — every 30min"},{"name":"Local trains","from":"Shinjuku Station","time":"~3h","price":"¥2,510","jrPass":"Partial","note":"Cheapest with multiple transfers"}],"destination":"Kawaguchiko Station, Yamanashi, Japan","mapsCoord":"35.5025,138.7551"},{"id":"kawagoe","name":"Kawagoe","kanji":"川越","tag":"Historic","color":"#ffaa00","colorBg":"255,170,0","time":"30 min","price":"¥490","short":"Little Edo — preserved 19th-century streets, candy alley, and the iconic Bell Tower.","desc":"Just 30 minutes from Ikebukuro lies a time portal. Kawagoe (nicknamed 'Koedo' — Little Edo) preserves an entire neighborhood of clay-walled warehouses (kurazukuri) from the Edo period, when it was a key supply town for old Tokyo. Walk down Kurazukuri Street to feel transported to the samurai era. Don't miss Kashiya Yokocho (Candy Alley) — a tiny lane lined with traditional sweet shops selling old-school Japanese candies.","highlights":["Toki no Kane (Bell Tower) — symbol of Kawagoe since the 1600s","Kurazukuri Street — preserved warehouse district","Kashiya Yokocho — Candy Alley with old-school sweet shops","Kitain Temple — 540 stone statues of disciples of Buddha","Hikawa Shrine — famous for love charms"],"tip":"Rent a kimono for the day and stroll the historic streets — many shops near Hon-Kawagoe Station offer rentals from ¥3,000. Saturday is busy but lively with street food.","transport":[{"name":"Tobu Tojo Line (Express)","from":"Ikebukuro Station","time":"30 min","price":"¥490","jrPass":false,"note":"Fastest & cheapest direct"},{"name":"JR Saikyo/Kawagoe Line","from":"Shinjuku Station","time":"55 min","price":"¥770","jrPass":true,"note":"Direct rapid train via Omiya"},{"name":"Seibu Shinjuku Line","from":"Seibu-Shinjuku Station","time":"50-60 min","price":"¥520","jrPass":false,"note":"To Hon-Kawagoe (closest to old town)"}],"destination":"Kawagoe Station, Saitama, Japan","mapsCoord":"35.9089,139.4856"},{"id":"nikko","name":"Nikko","kanji":"日光","tag":"Historic","color":"#00ff8c","colorBg":"0,255,140","time":"1h 50min","price":"from ¥3,200","short":"UNESCO World Heritage shrines and temples in a mountain setting with waterfalls and lakes.","desc":"Hidden in the mountains north of Tokyo lies Nikko — a town so beautiful even the proverb says 'never say magnificent until you've seen Nikko'. The lavishly decorated Toshogu Shrine (UNESCO World Heritage) is the mausoleum of Tokugawa Ieyasu, founder of the shogunate that ruled Japan for 250 years. The surrounding national park offers Kegon Falls (97m), Lake Chuzenji, and the steaming valleys of Yumoto Onsen.","highlights":["Toshogu Shrine — UNESCO, mausoleum of Ieyasu Tokugawa","Three Wise Monkeys carving (see no evil, hear no evil, speak no evil)","Kegon Falls — 97m waterfall, best viewed by elevator","Lake Chuzenji at 1,269m altitude","Shinkyo Sacred Bridge over the Daiya River"],"tip":"Spacia X is the new luxury train (since 2023) — cafe car, panoramic windows, family compartments. Way more comfortable than the standard Kegon "name":"Mt. Takao + Keio 1-Day","from":"Shinjuku Station","time":"50 min","price":"¥2,300","jrPass":false,"note":"Includes cable car + monkey park"}],"destination":"Takaosanguchi Station, Hachioji, Tokyo, Japan","mapsCoord":"35.6322,139.2700"},{"id":"hakone","name":"Hakone","kanji":"箱根","tag":"Onsen","color":"#ff8aa3","colorBg":"255,138,163","time":"1h 20min","price":"from ¥2,420","short":"Onsen paradise — hot springs, Lake Ashi, Open-Air Museum and Mt. Fuji views.","desc":"Japan's most beloved hot spring destination. Hakone is a volcanic valley town with sulfur springs, a pirate-themed sightseeing boat on Lake Ashi, a famous open-air sculpture museum, and on clear days, postcard-perfect views of Mt. Fuji. The classic 'Hakone Loop' uses 5 different forms of transport (mountain train, cable car, ropeway, boat, bus) — all covered by the Hakone Freepass.","highlights":["Lake Ashi with pirate ship + Mt. Fuji backdrop","Hakone Open-Air Museum (Picasso, Henry Moore, more)","Owakudani — volcanic valley with black eggs","Hakone Tozan Railway — Japan's oldest mountain railway","Hot springs everywhere — Hakone-Yumoto, Gora, Miyanoshita"],"tip":"Get the Hakone Freepass (¥7,100 for 2 days from Shinjuku) — it covers ALL transport in the loop. Adding the Romancecar surcharge (¥1,200) is worth it for the panoramic windows and Mt. Fuji views.","transport":[{"name":"Odakyu Romancecar","from":"Shinjuku Station","time":"1h 20min","price":"¥2,420","jrPass":false,"note":"Direct to Hakone-Yumoto, reserved seats"},{"name":"Hakone Freepass (2-day)","from":"Shinjuku Station","time":"1h 20min","price":"¥7,100","jrPass":false,"note":"All Hakone transport + round-trip"},{"name":"Odakyu Express (no surcharge)","from":"Shinjuku Station","time":"~2h","price":"¥1,261","jrPass":false,"note":"Slower but cheap (transfer at Odawara)"}],"destination":"Hakone-Yumoto Station, Kanagawa, Japan","mapsCoord":"35.2326,139.1064"}];

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* DIGITAL CORRUPT GLITCH SOUND */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function playGlitchSound(){
  const ctx=initAudio();
  if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  if(ctx.state!=='running')return;
  const now=ctx.currentTime;
  const dur=0.13;
  
  // Layer 1: BIT-CRUSHED noise (digital corruption)
  const bufSize=Math.floor(ctx.sampleRate*dur);
  const noiseBuf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=noiseBuf.getChannelData(0);
  // Bit-crush: quantize values to simulate broken digital signal
  const bits=4; // very low resolution = "broken" sound
  const step=Math.pow(2,bits);
  for(let i=0;i<bufSize;i++){
    let v=(Math.random()*2-1)*0.5;
    // Sample-and-hold to simulate sample rate reduction
    if(i%6!==0)v=data[i-1]||v;
    // Quantize to bit-crush
    v=Math.round(v*step)/step;
    data[i]=v;
  }
  const noise=ctx.createBufferSource();
  noise.buffer=noiseBuf;
  
  // High-pass to add digital harshness
  const hpFilter=ctx.createBiquadFilter();
  hpFilter.type='highpass';
  hpFilter.frequency.value=400;
  hpFilter.Q.value=2;
  
  const noiseGain=ctx.createGain();
  noiseGain.gain.setValueAtTime(0,now);
  noiseGain.gain.linearRampToValueAtTime(0.18,now+0.003);
  noiseGain.gain.linearRampToValueAtTime(0.05,now+0.04);
  noiseGain.gain.linearRampToValueAtTime(0.15,now+0.07);
  noiseGain.gain.exponentialRampToValueAtTime(0.001,now+dur);
  
  noise.connect(hpFilter);
  hpFilter.connect(noiseGain);
  noiseGain.connect(ctx.destination);
  
  // Layer 2: Square wave with rapid frequency stutters (data error beeps)
  const osc=ctx.createOscillator();
  osc.type='square';
  const oscGain=ctx.createGain();
  
  // Rapid frequency jumps - like digital data being corrupted
  const freqs=[1800,440,2200,180,1600,520,2800,80,1400];
  freqs.forEach((f,i)=>{osc.frequency.setValueAtTime(f,now+i*(dur/freqs.length));});
  
  oscGain.gain.setValueAtTime(0,now);
  oscGain.gain.linearRampToValueAtTime(0.07,now+0.002);
  oscGain.gain.exponentialRampToValueAtTime(0.001,now+dur);
  
  osc.connect(oscGain);
  oscGain.connect(ctx.destination);
  
  // Layer 3: Sub-bass thud with sharp pitch drop (data corruption / system error)
  const subOsc=ctx.createOscillator();
  subOsc.type='sawtooth';
  subOsc.frequency.setValueAtTime(140,now);
  subOsc.frequency.exponentialRampToValueAtTime(35,now+dur);
  
  // Distortion via WaveShaper for "corrupted" sound
  const shaper=ctx.createWaveShaper();
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){
    const x=(i/128)-1;
    curve[i]=Math.tanh(x*4); // soft clipping
  }
  shaper.curve=curve;
  
  const subGain=ctx.createGain();
  subGain.gain.setValueAtTime(0,now);
  subGain.gain.linearRampToValueAtTime(0.1,now+0.005);
  subGain.gain.exponentialRampToValueAtTime(0.001,now+dur);
  
  subOsc.connect(shaper);
  shaper.connect(subGain);
  subGain.connect(ctx.destination);
  
  // Layer 4: High-pitched digital "screech" (broken signal)
  const screech=ctx.createOscillator();
  screech.type='sawtooth';
  screech.frequency.setValueAtTime(3200,now);
  screech.frequency.setValueAtTime(2400,now+0.025);
  screech.frequency.setValueAtTime(4500,now+0.05);
  screech.frequency.setValueAtTime(1800,now+0.08);
  screech.frequency.setValueAtTime(3800,now+0.105);
  
  const screechGain=ctx.createGain();
  screechGain.gain.setValueAtTime(0,now);
  screechGain.gain.linearRampToValueAtTime(0.04,now+0.003);
  screechGain.gain.exponentialRampToValueAtTime(0.001,now+dur);
  
  screech.connect(screechGain);
  screechGain.connect(ctx.destination);
  
  noise.start(now);noise.stop(now+dur);
  osc.start(now);osc.stop(now+dur);
  subOsc.start(now);subOsc.stop(now+dur);
  screech.start(now);screech.stop(now+dur);
}

function triggerGlitch(){
  const pulseEl=document.querySelector('.h-title em');
  if(!pulseEl)return;
  pulseEl.classList.add('glitching');
  playGlitchSound();
  setTimeout(()=>{pulseEl.classList.remove('glitching');},340);
}

function startGlitchLoop(){
  if(glitchTimeout)return;
  function scheduleNext(){
    if(!isHomeActive)return;
    // FASTER: 1.5-3 seconds (was 4-6.5)
    const delay=1500+Math.random()*1500;
    glitchTimeout=setTimeout(()=>{if(!isHomeActive)return;triggerGlitch();scheduleNext();},delay);
  }
  scheduleNext();
}

function stopGlitchLoop(){if(glitchTimeout){clearTimeout(glitchTimeout);glitchTimeout=null;}}

document.addEventListener('click',function initAudioOnce(){initAudio();if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}document.removeEventListener('click',initAudioOnce);},{once:true});
document.addEventListener('touchstart',function initAudioOnce(){initAudio();if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}document.removeEventListener('touchstart',initAudioOnce);},{once:true});

// Stop audio + glitches when tab loses visibility (mobile/desktop)
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    stopGlitchLoop();
    if(audioCtx&&audioCtx.state==='running'){audioCtx.suspend();}
  }else{
    if(isHomeActive){
      startGlitchLoop();
      if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}
    }
  }
});
// Also stop on page unload
window.addEventListener('pagehide',function(){stopGlitchLoop();if(audioCtx){audioCtx.close();audioCtx=null;}});
window.addEventListener('beforeunload',function(){stopGlitchLoop();if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}});
window.addEventListener('blur',function(){stopGlitchLoop();if(audioCtx&&audioCtx.state==='running'){audioCtx.suspend();}});
window.addEventListener('focus',function(){if(isHomeActive){startGlitchLoop();if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}}});

      <line x1="50" y1="22" x2="50" y2="38" stroke="#a0a0b0" stroke-width="0.4" opacity="0.7"/>
      
      <!-- LONG NECK extending forward-left (curved up then down) -->
      <path d="M30 30 Q22 24 18 20 Q14 16 10 14" stroke="#5a5a6a" stroke-width="1.5" fill="none"/>
      <!-- Neck thickness (white outline) -->
      <path d="M30 30 Q22 24 18 20 Q14 16 10 14 L12 11 L8 16 Z" fill="#ffffff" stroke="#7a7a8a" stroke-width="0.5"/>
      
      <!-- HEAD - small round head at front -->
      <circle cx="9" cy="13" r="3" fill="#ffffff" stroke="#5a5a6a" stroke-width="0.7"/>

      <path d="M6 13 L1 11 L4 14 L1 15 Z" fill="#ff9933" stroke="#cc6600" stroke-width="0.4"/>
      
      <!-- RED CROWN spot on head (typical of Japanese cranes!) -->
      <ellipse cx="10" cy="10" rx="1.5" ry="1" fill="#dd2244"/>
      
      <!-- EYE -->
      <circle cx="10" cy="13" r="0.7" fill="#222"/>

      <!-- LEFT WING - extended UP and back (the iconic flying pose) -->
      <g class="wing">
        <!-- Main wing shape -->
        <path d="M50 22 Q55 5 70 2 Q82 4 78 18 Q72 14 65 16 Q58 18 50 22 Z" fill="url(#cW${rid})" stroke="#6a6a7a" stroke-width="0.6"/>
        <!-- Feather lines on wing -->
        <line x1="58" y1="10" x2="60" y2="20" stroke="#909098" stroke-width="0.5"/>
        <line x1="64" y1="6" x2="65" y2="18" stroke="#909098" stroke-width="0.5"/>
        <line x1="70" y1="4" x2="70" y2="16" stroke="#909098" stroke-width="0.5"/>
        <line x1="75" y1="6" x2="74" y2="16" stroke="#909098" stroke-width="0.5"/>
        <!-- Wing tip highlights -->

        <path d="M50 38 Q55 50 65 52 Q70 50 65 42 Q58 42 50 38 Z" fill="#e8e8f0" stroke="#7a7a8a" stroke-width="0.5"/>

        <line x1="60" y1="44" x2="62" y2="49" stroke="#a0a0b0" stroke-width="0.4"/>

      <line x1="40" y1="28" x2="65" y2="28" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>
      <line x1="20" y1="22" x2="28" y2="26" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>
    </g>
  </svg>`;}
  function spawn(){if(!isHomeActive)return;const el=document.createElement('div');el.className='fall-elem';if(season==='sakura'){el.classList.add('sakura');el.style.left=Math.random()*95+'%';const size=10+Math.random()*8;el.innerHTML=sakuraSVG(size);el.style.animationDuration=(8+Math.random()*7)+'s';el.style.opacity=0.55+Math.random()*0.35;}else if(season==='autumn'){el.classList.add('autumn');el.style.left=Math.random()*95+'%';const size=12+Math.random()*8;el.innerHTML=Math.random()<0.4?ginkgoSVG(size):momijiSVG(size);el.style.animationDuration=(7+Math.random()*6)+'s';el.style.opacity=0.55+Math.random()*0.35;}else{el.classList.add('crane');if(Math.random()<0.5)el.classList.add('alt');const size=44+Math.random()*18;el.innerHTML=craneSVG(size);el.style.left='100%';el.style.top=(5+Math.random()*45)+'%';el.style.animationDuration=(15+Math.random()*8)+'s';el.style.opacity=0.75+Math.random()*0.2;}layer.appendChild(el);setTimeout(()=>el.remove(),25000);}
  for(let i=0;i<3;i++)setTimeout(spawn,i*1400);
  const interval=season==='cranes'?5000:1900;
  seasonInterval=setInterval(spawn,interval);
}

/* WEATHER WIDGET - geolocation + Open-Meteo */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const TOKYO_FALLBACK={lat:35.6895,lon:139.6917,name:'Tokyo'};

async function loadWeatherWidget(){
  const widget=document.getElementById('weatherWidget');
  if(!widget)return;
  
  let coords=null;
  
  // Step 1: Try geolocation
  try{
    if(navigator.geolocation){
      coords=await new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(
          p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,fromGeo:true}),
          e=>reject(e),
          {timeout:6000,maximumAge:600000}
        );
      });
    }
  }catch(e){
    // User denied or geolocation unavailable
    coords=null;
  }
  
  // Fallback to Tokyo center
  if(!coords)coords={...TOKYO_FALLBACK,fromGeo:false};
  
  // Step 2: Fetch weather + place name in parallel
  try{
    const weatherUrl=`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,weather_code,is_day&timezone=auto`;
    
    const reverseUrl=coords.fromGeo
      ?`https://nominatim.openstreetmap.org/reverse?format=json&lat=${coords.lat}&lon=${coords.lon}&zoom=14&accept-language=en`
      :null;
    
    const promises=[fetch(weatherUrl).then(r=>r.json())];
    if(reverseUrl){
      promises.push(fetch(reverseUrl,{headers:{'Accept':'application/json'}}).then(r=>r.json()).catch(()=>null));
    }
    
    const results=await Promise.all(promises);
    const weather=results[0];
    const place=results[1];
    
    if(!weather||!weather.current){throw new Error('No weather data');}
    
    const temp=Math.round(weather.current.temperature_2m);
    const code=weather.current.weather_code;
    const isDay=weather.current.is_day===1;
    const iconKey=wmoToIcon(code,isDay);
    
    // Build place name
    let placeName='Tokyo';
    if(coords.fromGeo&&place&&place.address){
      const a=place.address;
      // Try to get neighborhood/suburb first, then city
      placeName=a.suburb||a.neighbourhood||a.quarter||a.city_district||a.town||a.city||a.village||a.county||'Tokyo';
      // If very long, trim
      if(placeName.length>14)placeName=placeName.substring(0,14)+'…';
    }else if(!coords.fromGeo){
      placeName='Tokyo';
    }
    
    widget.innerHTML=`
      <div class="ww-content">
        <div class="ww-top">
          <div class="ww-icon">${WICON[iconKey]||WICON.cloudy}</div>
          <div class="ww-temp">${temp}°</div>
        </div>
        <div class="ww-place"><span class="ww-dot"></span>${placeName}</div>
      </div>`;
  }catch(err){
    widget.innerHTML=`
      <div class="ww-content">
        <div class="ww-top">
          <div class="ww-icon">${WICON.partly}</div>
          <div class="ww-temp">18°</div>
        </div>
        <div class="ww-place"><span class="ww-dot offline"></span>Tokyo</div>
      </div>`;
  }
}

function getLinkIcon(label){const l=label.toLowerCase();if(l.includes('map'))return 'ti-map-pin';if(l.includes('schedule')||l.includes('timetable')||l.includes('calendar'))return 'ti-calendar';if(l.includes('book')||l.includes('reserv')||l.includes('ticket')||l.includes('pass'))return 'ti-ticket';if(l.includes('facebook'))return 'ti-brand-facebook';if(l.includes('tripadvisor'))return 'ti-star';if(l.includes('pdf')||l.includes('file'))return 'ti-file';return 'ti-world';}

let tripFilter='All';

let userCoordsCache=null;
async function getUserCoords(){
  if(userCoordsCache)return userCoordsCache;
  try{
    if(!navigator.geolocation)return null;
    const pos=await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(
        p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),
        e=>reject(e),
        {timeout:6000,maximumAge:600000}
      );
    });
    userCoordsCache=pos;
    return pos;
  }catch(e){return null;}
}

function openMapsRoute(destination,origin){
  // Open Google Maps with directions (transit mode)
  const dest=encodeURIComponent(destination);
  if(origin){
    const o=typeof origin==='string'?encodeURIComponent(origin):`${origin.lat},${origin.lon}`;
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${dest}&travelmode=transit`,'_blank');
  }else{
    window.open(`https://www.google.com/maps/search/?api=1&query=${dest}`,'_blank');
  }
}

async function openMapsFromMyLocation(destination){
  const coords=await getUserCoords();
  if(coords){
    openMapsRoute(destination,coords);
  }else{
    alert('Please enable location access to use this feature, or use "From Tokyo Station" instead.');
  }
}

function jpInitVoice(){
  if(jpVoice)return jpVoice;
  if(!('speechSynthesis' in window))return null;
  const voices=window.speechSynthesis.getVoices();
  jpVoice=voices.find(v=>v.lang.startsWith('ja'))||null;
  return jpVoice;
}

function jpSpeak(text,event){
  if(event){event.stopPropagation();}
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang='ja-JP';
  utter.rate=0.85;
  utter.pitch=1.0;
  const voice=jpInitVoice();
  if(voice)utter.voice=voice;
  const btn=event?event.currentTarget:null;
  if(btn){
    btn.classList.add('playing');
    utter.onend=()=>btn.classList.remove('playing');
    utter.onerror=()=>btn.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

// Load voices when available (some browsers load async)
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>{jpVoice=null;jpInitVoice();};
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* UNIVERSAL SEARCH */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const SEARCH_CHIPS=[

// Normalize string for search (lowercase, no accents)
function searchNorm(s){
  if(!s)return '';
  return s.toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

// Build a unified search index from all data sources
function buildSearchIndex(){
  const idx=[];
  // Izakayas
  BARS.forEach(b=>{
    idx.push({
      id:b.id,
      type:'izakaya',
      name:b.name,
      kanji:b.kanji,

    });

  // Frikis
  FRIKIS.forEach(f=>{
    idx.push({
      id:f.id,
      type:'friki',
      name:f.name,
      kanji:f.kanji,
      area:f.area,
      cat:'FRIKI',
      icon:'👹',
      desc:f.short||f.desc,
      meta:[f.tag,f.area],
      onclick:`showFrikiDetail('${f.id}')`,
      searchText:[f.name,f.kanji,f.area,f.tag,f.short||'',f.desc||'','weird','themed','restaurant'].join(' ')
    });
  });
  // Free things
  FREE.forEach(f=>{
    idx.push({
      id:f.id,
      type:'free',
      name:f.name,
      kanji:f.kanji,
      area:f.area,
      cat:'FREE',
      icon:'🎟️',
      desc:f.short||f.desc,
      meta:[f.tag,f.area],
      onclick:`showFreeDetail('${f.id}')`,
      searchText:[f.name,f.kanji,f.area,f.tag,f.short||'',f.desc||'','free','attraction'].join(' ')
    });
  });
  // Get around
  GETAROUND.forEach(g=>{
    idx.push({
      id:g.id,
      type:'getaround',
      name:g.name,
      kanji:g.kanji,
      area:'',
      cat:'TRANSPORT',
      icon:g.icon||'🚇',
      desc:g.short,
      meta:[g.category||'Transport'],
      onclick:`showGetAroundDetail('${g.id}')`,
      searchText:[g.name,g.kanji,g.short,g.category||'','transport','train','metro','jr'].join(' ')
    });
  });
  // Trips
  if(typeof TRIPS!=='undefined'){
    TRIPS.forEach(t=>{
      idx.push({
        id:t.id,
        type:'trip',
        name:t.name,
        kanji:t.kanji,
        area:t.tag,
        cat:'DAY TRIP',
        icon:'🗾',
        desc:t.short,
        meta:[t.time,t.price,t.tag],
        onclick:`showTripDetail('${t.id}')`,
        searchText:[t.name,t.kanji,t.tag,t.short,t.desc,'trip','day','escape'].join(' ')
      });
    });
  }
  // Manners
  if(typeof MANNERS_DATA!=='undefined'){
    MANNERS_DATA.forEach(m=>{
      idx.push({
        id:m.id,
        type:'manners',
        name:m.title,
        kanji:'',
        area:'',
        cat:'MANNERS',
        icon:m.icon,
        desc:m.intro,
        meta:['Etiquette'],
        onclick:`showMannersDetail('${m.id}')`,
        searchText:[m.title,m.intro,m.dos.join(' '),m.donts.join(' '),'manners','etiquette','behave','rules','culture','japanese'].join(' ')
      });
    });
  }
  return idx;
}

let SEARCH_INDEX=null;

function runSearch(q){
  if(!SEARCH_INDEX)SEARCH_INDEX=buildSearchIndex();
  const qn=searchNorm(q);
  if(!qn)return [];
  // Score: name match > kanji > area > desc
  const results=[];
  SEARCH_INDEX.forEach(item=>{
    const nameN=searchNorm(item.name);
    const kanjiN=searchNorm(item.kanji);
    const allN=searchNorm(item.searchText);
    let score=0;
    if(nameN===qn)score+=100;
    else if(nameN.startsWith(qn))score+=50;
    else if(nameN.includes(qn))score+=30;
    if(kanjiN.includes(qn))score+=25;
    if(searchNorm(item.area).includes(qn))score+=20;
    if(allN.includes(qn))score+=10;
    if(score>0)results.push({item,score});
  });
  results.sort((a,b)=>b.score-a.score);
  return results.map(r=>r.item);
}

// Highlight match in text
function highlightMatch(text,q){
  if(!text||!q)return text||'';
  const qn=searchNorm(q);
  const tn=searchNorm(text);
  const i=tn.indexOf(qn);
  if(i<0)return text;
  // Find original string positions (no normalization applied to text length)
  // Use same length as q (assuming normalization doesn't change length much)
  const before=text.substring(0,i);
  const match=text.substring(i,i+q.length);
  const after=text.substring(i+q.length);
  return before+'<mark>'+match+'</mark>'+after;
}

// Truncate desc to relevant snippet around the match
function getSnippet(desc,q,maxLen=120){
  if(!desc)return '';
  if(!q)return desc.length>maxLen?desc.substring(0,maxLen)+'…':desc;
  const qn=searchNorm(q);
  const dn=searchNorm(desc);
  const i=dn.indexOf(qn);
  if(i<0)return desc.length>maxLen?desc.substring(0,maxLen)+'…':desc;
  // Center snippet around match
  const start=Math.max(0,i-30);
  const end=Math.min(desc.length,i+q.length+60);
  let snippet=desc.substring(start,end);
  if(start>0)snippet='…'+snippet;
  if(end<desc.length)snippet=snippet+'…';
  return highlightMatch(snippet,q);
}

function renderSearchResults(q){
  const resultsEl=document.getElementById('searchResults');
  if(!resultsEl)return;
  if(!q||q.length<1){
    resultsEl.innerHTML=`<div class="search-empty">
      <i class="ti ti-search search-empty-icon"></i>
      <div class="search-empty-title">Search inside the app</div>
      <div class="search-empty-sub">Bars, transport, free things, day trips…<br>Or tap a chip above to explore</div>
    </div>`;
    return;
  }
  const results=runSearch(q);
  if(results.length===0){
    resultsEl.innerHTML=`<div class="search-noresults">
      <i class="ti ti-zoom-question"></i>
      <p>No results for <strong>"${q}"</strong><br>Try a shorter or different keyword</p>
    </div>`;
    return;
  }
  const typeClass={izakaya:'r-iz',friki:'r-fr',free:'r-free',getaround:'r-ga',trip:'r-trip',manners:'r-manners'};
  const cards=results.map(r=>{
    const cls=typeClass[r.type]||'';
    const nameH=highlightMatch(r.name,q);
    const kanjiH=r.kanji?` <span class="sr-kanji">${highlightMatch(r.kanji,q)}</span>`:'';
    const snippet=getSnippet(r.desc,q);
    const meta=r.meta.filter(Boolean).map(m=>`<span>${highlightMatch(m,q)}</span>`).join(' · ');
    return `<div class="search-result ${cls}" onclick="${r.onclick}">
      <div class="search-result-icon">${r.icon}</div>
      <div class="search-result-body">
        <div class="search-result-top">
          <div class="search-result-name">${nameH}${kanjiH}</div>
          <div class="search-result-cat">${r.cat}</div>
        </div>
        <div class="search-result-snippet">${snippet}</div>
        ${meta?`<div class="search-result-meta">${meta}</div>`:''}
      </div>
    </div>`;
  }).join('');
  resultsEl.innerHTML=`<div class="search-count">Results <span class="search-count-num">${results.length}</span></div>${cards}`;
}

function onSearchInput(e){
  const q=e.target.value;
  const clear=document.getElementById('searchClear');
  if(clear)clear.style.display=q?'block':'none';
  renderSearchResults(q);
}

function clearSearch(){
  const input=document.getElementById('searchInput');
  if(input){input.value='';input.focus();}
  document.getElementById('searchClear').style.display='none';
  renderSearchResults('');
}

function searchChipClick(q){
  const input=document.getElementById('searchInput');
  if(input){
    input.value=q;
    input.focus();
    document.getElementById('searchClear').style.display='block';
    renderSearchResults(q);
  }
}

function showSearch(){
  leaveHome();
  const chips=SEARCH_CHIPS.map(c=>`<button class="search-chip" onclick="searchChipClick('${c.q}')"><i class="ti ${c.icon}"></i>${c.label}</button>`).join('');
  setScreen(`<div class="pg">
    <div class="ptitle" style="color:#00d2ff">Search</div>
    <div class="psub">Inside Tokyo Pulse · 32 places + transport</div>
    <div class="search-input-wrap">
      <i class="ti ti-search"></i>
      <input id="searchInput" class="search-input" type="text" placeholder="Find bars, transport, free things..." autocomplete="off" oninput="onSearchInput(event)">
      <i class="ti ti-x" id="searchClear" style="display:none" onclick="clearSearch()"></i>
    </div>
    <div class="search-chips">${chips}</div>
    <div id="searchResults"></div>
  </div>`);
  renderSearchResults('');
  // Auto-focus the input
  setTimeout(()=>{const i=document.getElementById('searchInput');if(i)i.focus();},100);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* FAVORITES SYSTEM (localStorage) */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const FAV_KEY='tp_favs_v1';
const FAV_HEART_OUTLINE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
const FAV_HEART_FILLED='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
const FAV_TRASH='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

function favLoad(){
  try{
    const raw=localStorage.getItem(FAV_KEY);
    if(!raw)return {};
    return JSON.parse(raw);
  }catch(e){return {};}
}

function favSave(data){
  try{localStorage.setItem(FAV_KEY,JSON.stringify(data));}catch(e){}
}

function favIsSaved(type,id){
  const all=favLoad();
  return all[type]&&all[type][id]===true;
}

function favToggle(type,id,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const all=favLoad();
  if(!all[type])all[type]={};
  const wasSaved=all[type][id]===true;
  if(wasSaved){
    delete all[type][id];
  }else{
    all[type][id]=true;
  }
  favSave(all);
  // Visual feedback on the button
  if(event&&event.currentTarget){
    const btn=event.currentTarget;
    if(!wasSaved){
      btn.classList.add('saved');
      btn.innerHTML=FAV_HEART_FILLED;
      btn.classList.add('popping');
      setTimeout(()=>btn.classList.remove('popping'),460);
      // pulse effect
      const pulse=document.createElement('div');
      pulse.className='fav-pulse go';
      btn.parentElement.appendChild(pulse);
      setTimeout(()=>pulse.remove(),720);
    }else{
      btn.classList.remove('saved');
      btn.innerHTML=FAV_HEART_OUTLINE;
    }
  }
  return !wasSaved;
}

function favCount(type){
  const all=favLoad();
  if(!all[type])return 0;
  return Object.keys(all[type]).length;
}

function favCountTotal(){
  const all=favLoad();
  let n=0;
  for(const t in all)n+=Object.keys(all[t]).length;
  return n;
}

function favList(type){
  const all=favLoad();
  if(!all[type])return [];
  return Object.keys(all[type]);
}

function favClearAll(){
  if(!confirm('Clear all your saved places? This cannot be undone.'))return;
  localStorage.removeItem(FAV_KEY);
  showMe();
}

function favBtnHtml(type,id){
  const saved=favIsSaved(type,id);
  const cls=saved?'fav-btn saved':'fav-btn';
  const icon=saved?FAV_HEART_FILLED:FAV_HEART_OUTLINE;
  return `<button class="${cls}" onclick="favToggle('${type}','${id}',event)" aria-label="Save">${icon}</button>`;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* ME / SAVED PAGE */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function showMe(){
  leaveHome();setNav('n-me');
  const izCount=favCount('iz');
  const frCount=favCount('fr');
  const freeCount=favCount('free');
  const tripCount=favCount('trip');
  const total=izCount+frCount+freeCount+tripCount;
  
  let html=`<div class="pg">
    <div class="ptitle" style="color:#9650ff">My <span style="color:#fff">Tokyo</span></div>
    <div class="psub">${total===0?'No places saved yet':total+' saved place'+(total===1?'':'s')}</div>
    
    <div class="me-stats">
      <div class="me-stat" style="border-color:rgba(150,80,255,0.3);background:rgba(150,80,255,0.07)" onclick="${izCount>0?'showSavedSection(\'iz\')':''}">
        <div class="me-stat-num" style="color:#c89fff">${izCount}</div>
        <div class="me-stat-lbl" style="color:#c89fff">Izakayas</div>
      </div>
      <div class="me-stat" style="border-color:rgba(255,51,102,0.3);background:rgba(255,51,102,0.07)" onclick="${frCount>0?'showSavedSection(\'fr\')':''}">
        <div class="me-stat-num" style="color:#ff8aa3">${frCount}</div>
        <div class="me-stat-lbl" style="color:#ff8aa3">Frikis</div>
      </div>
      <div class="me-stat" style="border-color:rgba(0,210,255,0.3);background:rgba(0,210,255,0.07)" onclick="${freeCount>0?'showSavedSection(\'free\')':''}">
        <div class="me-stat-num" style="color:#7ce0ff">${freeCount}</div>
        <div class="me-stat-lbl" style="color:#7ce0ff">Free</div>
      </div>
      <div class="me-stat" style="border-color:rgba(255,170,0,0.3);background:rgba(255,170,0,0.07)" onclick="${tripCount>0?'showSavedSection(\'trip\')':''}">
        <div class="me-stat-num" style="color:#ffc966">${tripCount}</div>
        <div class="me-stat-lbl" style="color:#ffc966">Trips</div>
      </div>
    </div>`;
  
  if(total===0){
    html+=`<div class="me-empty">
      <div class="me-empty-icon">💔</div>
      <div class="me-empty-title">No favorites yet</div>
      <div class="me-empty-sub">Tap the <b>♥</b> on any place to save it here.<br>Your saved places stay on this device.</div>
    </div>`;
  }else{
    // Render each section that has favorites
    if(izCount>0)html+=renderSavedSection('iz','🍻 Izakayas','#c89fff',izCount);
    if(frCount>0)html+=renderSavedSection('fr','👹 Friki Spots','#ff8aa3',frCount);
    if(freeCount>0)html+=renderSavedSection('free','🎟️ Free Things','#7ce0ff',freeCount);
    if(tripCount>0)html+=renderSavedSection('trip','🗾 Day Trips','#ffc966',tripCount);
    
    html+=`<button class="me-clear-btn" onclick="favClearAll()">🗑️ Clear all saved places</button>`;
  }
  
  html+=`<div style="margin-top:24px;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)">
    <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7a7a8a;font-weight:700;margin-bottom:5px">ℹ️ About saved places</div>
    <div style="font-size:11px;color:#9a9aaa;line-height:1.6">Your favorites are stored on this device only. They won't sync between devices, and may be lost if you clear browser data.</div>
  </div>`;
  
  html+=`</div>`;
  setScreen(html);
}

function renderSavedSection(type,title,color,count){
  const ids=favList(type);
  let cards='';
  ids.forEach(id=>{
    let item=null;
    let icoKey='';
    let onclick='';
    let kanji='';
    let meta='';
    if(type==='iz'){
      item=BARS.find(b=>b.id===id);
      icoKey=id;
      onclick=`showIzDetail('${id}')`;
      if(item){kanji=item.kanji;meta=item.area+' · '+item.price;}
    }else if(type==='fr'){
      item=FRIKIS.find(f=>f.id===id);
      icoKey='f_'+id;
      onclick=`showFrikiDetail('${id}')`;
      if(item){kanji=item.kanji;meta=item.area+' · '+item.tag;}
    }else if(type==='free'){
      item=FREE.find(f=>f.id===id);
      icoKey='fr_'+id;
      onclick=`showFreeDetail('${id}')`;
      if(item){kanji=item.kanji;meta=item.area+' · '+item.tag;}
    }else if(type==='trip'){
      item=TRIPS.find(t=>t.id===id);
      icoKey='t_'+id;
      onclick=`showTripDetail('${id}')`;
      if(item){kanji=item.kanji;meta=item.tag+' · '+item.time;}
    }
    if(!item)return;
    const img=PHOTOS[icoKey]||'';
    const rgbMap={iz:'150,80,255',fr:'255,51,102',free:'0,210,255',trip:'255,170,0'};
    const rgb=rgbMap[type]||'255,255,255';
    cards+=`<div class="saved-card" style="border-color:rgba(${rgb},0.25);background:rgba(${rgb},0.05)" onclick="${onclick}">
      <div class="saved-card-img" style="background-image:url(${img})"></div>
      <div class="saved-card-body">
        <div class="saved-card-text">
          <div class="saved-card-name" style="color:${color}">${item.name}<span class="sk">${kanji}</span></div>
          <div class="saved-card-meta">${meta}</div>
        </div>
        <button class="saved-card-remove" onclick="event.stopPropagation();favRemove('${type}','${id}')" aria-label="Remove">${FAV_TRASH}</button>
      </div>
    </div>`;
  });
  return `<div class="me-section-title" style="border-color:rgba(${type==='iz'?'150,80,255':type==='fr'?'255,51,102':type==='free'?'0,210,255':'255,170,0'},0.2)">${title} <span class="count">${count}</span></div>${cards}`;
}

function favRemove(type,id){
  const all=favLoad();
  if(all[type]&&all[type][id]){
    delete all[type][id];
    favSave(all);
    showMe();
  }
}

function showSavedSection(type){
  // For now, just scroll within Me page — could be expanded later
  showMe();
}

    if(s==='search'){setNav('n-search');showSearch();}
    else if(s==='events'){setNav('n-events');setScreen(`<div class="pg">
      <div class="ptitle" style="color:#ffaa00">Tokyo <span style="color:#fff">Events</span></div>
      <div class="psub">Festivals · Culture · Seasonal</div>
      
      <div style="margin-top:18px;padding:18px;border-radius:18px;border:1px solid rgba(255,170,0,0.35);background:linear-gradient(135deg,rgba(255,170,0,0.12),rgba(255,51,102,0.08));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden">

        <a href="https://www.gotokyo.org/en/calendar/index.html" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:14px;background:rgba(255,170,0,0.2);border:1px solid rgba(255,170,0,0.5);color:#fff;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:all 0.2s">
          <span style="font-size:20px">🗓️</span>

      <div style="margin-top:18px;padding:13px 15px;border-radius:13px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03)">
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7a7a8a;font-weight:700;margin-bottom:6px">ℹ️ About this section</div>
        <div style="font-size:11px;color:#9a9aaa;line-height:1.6;font-weight:400">Tokyo Pulse links to <b style="color:#c0c0d0">Go Tokyo</b>, the official tourism site, for the most accurate and up-to-date event information. This content is <b style="color:#c0c0d0">not produced or curated by Tokyo Pulse</b>.</div>
      </div>
      
      <div style="text-align:center;margin-top:24px;padding:20px;border-radius:14px;background:rgba(0,210,255,0.04);border:1px dashed rgba(0,210,255,0.2)">
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7ce0ff;font-weight:700;margin-bottom:6px">💡 Looking for more?</div>
        <div style="font-size:11px;color:#a0a0b0;line-height:1.6">Use <b style="color:#7ce0ff">Search</b> to find specific spots,<br>or explore the <b style="color:#7ce0ff">Free Things</b> section for free activities</div>
      </div>
    </div>`);}
    else if(s==='me'){showMe();}
  }
}

(function(){const c=document.getElementById('bg'),ctx=c.getContext('2d');let pts=[];const cols=['rgba(255,51,102,','rgba(0,210,255,','rgba(255,170,0,','rgba(0,255,140,','rgba(150,80,255,'];function resize(){const r=c.parentElement.getBoundingClientRect();c.width=r.width||360;c.height=r.height||720;pts=Array.from({length:35},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+0.3,col:cols[Math.floor(Math.random()*cols.length)],vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,a:Math.random()*.4+0.07,p:Math.random()*Math.PI*2,ps:.012+Math.random()*.018}));}function draw(){ctx.clearRect(0,0,c.width,c.height);pts.forEach(p=>{p.p+=p.ps;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.col+(p.a*(0.5+0.5*Math.sin(p.p)))+')';ctx.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;});requestAnimationFrame(draw);}resize();draw();})();

showHome();
